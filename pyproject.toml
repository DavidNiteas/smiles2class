[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "smiles2class"
version = "0.1.2"
description = "SMILES → molecular class probabilities (main / vice implementations)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "David Niteas", email = "david.ql.d@foxmail.com" }]
keywords = ["SMILES", "molecular classification", "cheminformatics", "Uni-Mol"]
requires-python = ">=3.10,<3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "unimol-lite @ git+https://github.com/MetaEngine-Dev/unimol_lite.git@v0.2.2",
  "numpy>=1.26,<2",
  "pandas>=2.0",
  "torch>=2.0",
  "transformers>=4.47,<5",
  "rdkit>=2025.9,<2026",
  "typer>=0.20",
]

[project.optional-dependencies]
vice = [
  "autogluon.tabular==1.2.0",
  "scikit-learn==1.5.1",
]
data = [
  "pyyaml>=6",
  "pyarrow>=15",
]
dev = [
  "build>=1.2",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pyyaml>=6",
]
eval = [
  "scikit-learn==1.5.1",
]
train = [
  "pytorch-lightning>=2.4",
  "torchmetrics>=1",
  "pyyaml>=6",
  "safetensors>=0.4",
  "autogluon.tabular==1.2.0",
  "scikit-learn==1.5.1",
]

[project.scripts]
smiles2class = "smiles2class.cli:app"

[project.urls]
Homepage = "https://github.com/DavidNiteas/smiles2class"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/smiles2class"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/training",
  "/pipelines",
  "/evaluation",
  "/benchmarks",
  "/AGENTS.md",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/AUTHORS",
  "/NOTICE",
  "/CITATION.cff",
  "/Makefile",
]
exclude = [
  "/_dev",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
