[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "smiles2class"
version = "0.1.0"
description = "SMILES → molecular class probabilities (main / vice implementations)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
dependencies = [
  "unimol-lite @ git+ssh://git@github.com/MetaEngine-Dev/unimol_lite.git@v0.1.0",
  "numpy>=1.26,<2",
  "pandas>=2.0",
  "torch>=2.0",
  "transformers>=4.47,<5",
  "rdkit>=2025.9,<2026",
  "typer>=0.20",
]

[project.optional-dependencies]
vice = [
  "autogluon.tabular==1.2.0",
  "scikit-learn==1.5.1",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
]

[project.scripts]
smiles2class = "smiles2class.cli:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/smiles2class"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
